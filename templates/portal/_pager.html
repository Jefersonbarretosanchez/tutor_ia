{% if page.paginator.num_pages > 1 %}
<div class="pager">
  {% if page.has_previous %}<a class="btn sec sm" hx-get="?{{ page.qs }}page={{ page.previous_page_number }}" hx-target="#results" hx-push-url="true">‹ Anterior</a>{% endif %}
  <span>Página {{ page.number }} de {{ page.paginator.num_pages }} · {{ page.paginator.count }} registros</span>
  {% if page.has_next %}<a class="btn sec sm" hx-get="?{{ page.qs }}page={{ page.next_page_number }}" hx-target="#results" hx-push-url="true">Siguiente ›</a>{% endif %}
</div>
{% else %}<div class="pager">{{ page.paginator.count }} registros</div>{% endif %}
