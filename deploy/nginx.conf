# /etc/nginx/sites-available/lti-chat.conf
# Ajustar el dominio y las rutas de certificado antes de activar.

server {
    listen 80;
    server_name lti-chat.tudominio.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name lti-chat.tudominio.com;

    ssl_certificate     /etc/letsencrypt/live/lti-chat.tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lti-chat.tudominio.com/privkey.pem;

    client_max_body_size 2m;

    location /static/ {
        alias /srv/lti-chat/staticfiles/;
        expires 30d;
    }

    location / {
        proxy_pass http://unix:/srv/lti-chat/run/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
