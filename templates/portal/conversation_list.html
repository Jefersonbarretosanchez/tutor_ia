{% extends "portal/base.html" %}
{% block title %}Conversaciones{% endblock %}
{% block content %}
<h2>Conversaciones con Clara</h2>
<form class="bar" hx-get="{% url 'portal:conversation_list' %}" hx-trigger="keyup changed delay:300ms from:#q, change" hx-target="#results" hx-push-url="true">
  <input id="q" type="search" name="q" value="{{ q }}" placeholder="Buscar estudiante…">
  <select name="momento"><option value="">Todos los momentos</option>{% for v, l in momentos %}<option value="{{ v }}" {% if momento == v %}selected{% endif %}>{{ l }}</option>{% endfor %}</select>
</form>
<div id="results">{% include "portal/_conversation_table.html" %}</div>
{% endblock %}
