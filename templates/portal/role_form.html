{% extends "portal/base.html" %}
{% block title %}Nuevo rol{% endblock %}
{% block content %}
<h2>Nuevo rol</h2>
<form method="post" class="card" style="max-width:560px">{% csrf_token %}
  {% for f in form %}
  <div class="field"><label for="{{ f.id_for_label }}">{{ f.label }}</label>{{ f }}{% for e in f.errors %}<div class="err">{{ e }}</div>{% endfor %}</div>
  {% endfor %}
  <button class="btn">Crear y asignar permisos</button>
  <a class="btn sec" href="{% url 'portal:role_list' %}">Cancelar</a>
</form>
{% endblock %}
