{% extends "portal/base.html" %}
{% block title %}Matrículas{% endblock %}
{% block content %}
<h2>Matrículas y consumo de tokens</h2>
<form class="bar" hx-get="{% url 'portal:enrollment_list' %}" hx-trigger="keyup changed delay:300ms from:#q, change" hx-target="#results" hx-push-url="true">
  <input id="q" type="search" name="q" value="{{ q }}" placeholder="Buscar estudiante…">
  <select name="course"><option value="">Todos los cursos</option>{% for c in courses %}<option value="{{ c.pk }}" {% if course == c.pk|stringformat:"s" %}selected{% endif %}>{{ c }}</option>{% endfor %}</select>
  <select name="status">
    <option value="">Todos</option>
    <option value="active" {% if status == "active" %}selected{% endif %}>Chat activo</option>
    <option value="blocked" {% if status == "blocked" %}selected{% endif %}>Chat bloqueado</option>
    <option value="instructor" {% if status == "instructor" %}selected{% endif %}>Instructores</option>
  </select>
</form>
<div id="results">{% include "portal/_enrollment_table.html" %}</div>
{% endblock %}
