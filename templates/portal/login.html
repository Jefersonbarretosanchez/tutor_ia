{% extends "portal/base.html" %}
{% block title %}Ingresar{% endblock %}
{% block anon %}
<div class="login card">
  <h2>Portal de administración</h2>
  <form method="post">{% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    {% for e in form.non_field_errors %}<div class="msg error">{{ e }}</div>{% endfor %}
    <div class="field"><label for="id_username">Usuario</label><input type="text" name="username" id="id_username" autofocus autocomplete="username" required></div>
    <div class="field"><label for="id_password">Contraseña</label><input type="password" name="password" id="id_password" autocomplete="current-password" required></div>
    <button class="btn" style="width:100%">Ingresar</button>
  </form>
</div>
{% endblock %}
